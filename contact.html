<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="bg-light">

    <!-- Navigation -->
    <div class="container-fluid p-5 my-5 bg-dark bg-gradient text-white">

        <div class="row align-items-center">

            <div class="col-md-6 text-center text-md-start">
                <h1>Contact Me</h1>
            </div>

            <div class="col-md-6">
                <nav class="nav justify-content-center justify-content-md-end mt-3 mt-md-0">
                    <a class="nav-link text-white" href="index.html">Home</a>
                    <a class="nav-link text-white" href="about.html">About</a>
                    <a class="nav-link text-white active fw-bold" href="contact.html">Contact</a>
                </nav>
            </div>

        </div>

    </div>

    <!-- Contact Section -->
    <main class="container py-5">

        <div class="row justify-content-center">

            <div class="col-12 col-md-8 col-lg-6">

                <div class="card shadow-sm border-0 rounded-4">

                    <div class="card-body p-4 p-md-5">

                        <h2 class="text-center mb-4">
                            Get In Touch
                        </h2>

                        <p class="text-center text-muted mb-4">
                            If you would like to contact me, feel free to send me a message.
                        </p>

                        <form>

                            <div class="mb-3">
                                <label for="name" class="form-label">
                                    Name
                                </label>

                                <input type="text"
                                       class="form-control"
                                       id="name"
                                       placeholder="Enter your name">
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label">
                                    Email
                                </label>

                                <input type="email"
                                       class="form-control"
                                       id="email"
                                       placeholder="Enter your email">
                            </div>

                            <div class="mb-3">
                                <label for="message" class="form-label">
                                    Message
                                </label>

                                <textarea class="form-control"
                                          id="message"
                                          rows="5"
                                          placeholder="Write your message here"></textarea>
                            </div>

                            <div class="text-center">

                                <button type="submit"
                                        class="btn btn-dark px-4">
                                    Send Message
                                </button>

                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </main>

    <!-- Footer -->
    <footer class="container-fluid bg-dark bg-gradient text-white text-center py-4 mt-5">

        <p class="mb-0">
            &copy; 2026 My Portfolio. All rights reserved.
        </p>

    </footer>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
